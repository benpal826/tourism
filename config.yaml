# 지역 변경은 이 파일만 고치면 됩니다.
mode: nearby            # nearby | theme (theme 는 구조만 열어둠, 아직 미구현)

nearby:
  radius_m: 700
  culture_radius_m: 1500   # 3순위(전시·축제)는 인근만 조금 넓게
  default_regions: [잠원, 신사, 고속터미널, 압구정]   # F18: 앱 설정의 기본 '내 지역'(나머지 역 데이터는 그대로 두고 앱에서 더할 수 있음)
  stations:             # 3호선 잠원역 ±2정거장
    - {name: 압구정, lat: 37.5270, lng: 127.0285}
    - {name: 신사,   lat: 37.5163, lng: 127.0203}
    - {name: 잠원,   lat: 37.5113, lng: 127.0113}
    - {name: 고속터미널, lat: 37.5049, lng: 127.0049}
    - {name: 교대,   lat: 37.4934, lng: 127.0146}

theme:                  # 추후 구현: 예) 서울 핫팝업
  name: 서울 핫팝업
  keywords: ["서울 팝업스토어"]

categories:             # 우선순위 순
  - {key: restaurant, label: 식당, priority: 1, kakao_code: FD6}
  - {key: cafe,       label: 카페, priority: 1, kakao_code: CE7}
  - {key: bar,        label: 술집, priority: 1, kakao_query: 술집}
  - {key: popup,      label: 팝업스토어, priority: 2}
  - {key: culture,    label: 전시·축제·기타, priority: 3}

trend:
  recent_days: 30
  exclude_phrases: [체험단, 협찬, 원고료, 제공받아, 제공 받아, 소정의]
  max_posts_per_place: 250   # 가게당 최대 가져올 글 수(카카오 검색, 최신순, 최근 30일 이전이 나오면 중단)
  surge_top_n: 10
  min_reviews: 30            # 카드에 올릴 최소 후기 수(1순위 먹거리)

limits:
  places_per_station_per_category: 15

discover:                    # F11 추천글 기반 발굴({st} = 역 이름)
  place_keywords:            # 카카오 장소 키워드 검색(역 반경) — 카테고리 목록만으론 놓치는 곳
    식당: [맛집, 데이트 맛집, 레스토랑, 파스타, 오마카세, 고기집]   # 카테고리 목록은 가까운 순 15곳뿐이라 맛집이 빠짐
    카페: [디저트카페, 루프탑카페]
    술집: [칵테일바, 와인바, 루프탑바, 이자카야]
  rec_queries:
    식당: ["{st}역 맛집", "{st} 맛집 추천", "{st} 데이트 맛집", "{st} 분위기 좋은 레스토랑"]
    카페: ["{st}역 카페", "{st} 분위기 좋은 카페", "{st} 뷰 카페"]
    술집: ["{st}역 술집", "{st} 칵테일바", "{st} 분위기 좋은 바"]
  enrich_per_station: 12     # 역·카테고리별 추천글 언급 상위 몇 곳만 후기·사진 보강(카드 10곳이 필터 뒤에도 남게 여유)

signals:                     # F12 카테고리별 순위 신호(후기 글에 들어간 비율)
  taste: [맛있, 존맛, 맛집, 재방문, 또 가, 웨이팅, 줄 서, 줄서, 인생, 감동, 최고]
  vibe: [분위기, 뷰, 루프탑, 야경, 창가, 테라스, 조명, 인테리어, 감성, 데이트, 아늑, 한강]

popup:
  curated_only: true   # F23: 팝업 카드는 주간 갱신 때 Claude 가 글을 읽고 장소·기간을 확인한 것만(python -m src.popups todo/import)

rank:
  cards_per_station_category: 10   # F21: 카드는 역 × 카테고리(식당·카페·술집)별 상위 몇 곳(지역을 골라 봐도 고르게)
  curate_top: 10             # 카테고리별 상위 몇 곳을 AI 가 사진 선별
