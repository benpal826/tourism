<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14141a">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<title>데이트 스와이프</title>
<style>
:root{--bg:#14141a;--card:#1e1e27;--fg:#f4f4f6;--mut:#9a9aa8;--pink:#ff4d79;--green:#2ecc71;--line:#2c2c38}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Pretendard","Noto Sans KR",system-ui,sans-serif;overflow:hidden;touch-action:pan-y;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 18px 6px}
header b{font-size:18px}header span{color:var(--mut);font-size:13px}
.seg{display:flex;margin:4px 14px 0;background:#23232d;border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--pink);color:#fff}
#map{flex:0 0 150px;margin:0 14px 4px;border-radius:16px;overflow:hidden;background:#23232d;touch-action:auto}
#map .leaflet-control-attribution{font-size:9px;background:#0008;color:#aaa}#map .leaflet-control-attribution a{color:#ccc}
.pin{background:var(--pink);border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px #000a}
.stn{background:#fee500;border:2px solid #111;border-radius:6px;width:auto!important;height:auto!important;padding:2px 6px;font-size:11px;font-weight:700;color:#111;white-space:nowrap}
#list{flex:1;overflow:auto;margin:8px 14px 14px;display:none}
.item{display:flex;gap:12px;background:var(--card);border-radius:16px;padding:10px;margin-bottom:10px}
.item .th{flex:0 0 84px;height:84px;border-radius:12px;background:#2c2c3a;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;position:relative}
.item .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.item .tx{flex:1;min-width:0;font-size:13px;line-height:1.5}
.item .tx b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx small{color:var(--mut)}
.item .bt{display:flex;gap:6px;margin-top:6px}
.item .bt a,.item .bt button{border:0;border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:700;text-decoration:none;cursor:pointer}
.item .bt a{background:#fee500;color:#111}.item .bt button{background:#2c2c3a;color:#ddd}
#stack{position:relative;flex:1;margin:6px 14px;min-height:0}
.card{position:absolute;inset:0;background:var(--card);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px #0008;will-change:transform;touch-action:none}
.card.back{transform:scale(.95) translateY(12px);opacity:.7}
.photo{position:relative;flex:0 0 52%;background:linear-gradient(135deg,#3a2f4f,#2b3a55);display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,var(--card))}
.tabs{position:absolute;left:10px;right:10px;bottom:30px;z-index:2;display:flex;gap:6px;justify-content:center}
.tabs button{border:0;border-radius:99px;padding:6px 11px;font-size:12.5px;background:#000a;color:#ddd;cursor:pointer}
.tabs button.on{background:var(--pink);color:#fff;font-weight:700}
.cnt{position:absolute;top:12px;right:12px;z-index:2;background:#000a;color:#fff;font-size:12px;padding:4px 9px;border-radius:99px}
.badge{position:absolute;top:12px;left:12px;z-index:2;background:var(--pink);color:#fff;font-weight:700;font-size:12px;padding:5px 10px;border-radius:99px}
.info{flex:1;padding:0 18px 16px;margin-top:-34px;position:relative;z-index:1;overflow:auto}
h2{margin:0 0 8px;font-size:24px;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:#2c2c3a;border-radius:99px;padding:4px 10px;font-size:12.5px;color:#dcdce6}
.chip.cat{background:#ff4d7933;color:#ff8aa6}
.row{display:flex;gap:10px;margin:8px 0;font-size:14px;line-height:1.45}
.row i{font-style:normal;flex:0 0 22px}
.row small{color:var(--mut)}
.stats{display:flex;gap:8px;margin:6px 0 10px}
.stat{flex:1;background:#262633;border-radius:12px;padding:8px 10px}
.stat b{display:block;font-size:18px}.stat span{font-size:11.5px;color:var(--mut)}
.map{display:inline-block;margin-top:8px;padding:9px 14px;border-radius:12px;background:#fee500;color:#111;font-weight:700;font-size:14px;text-decoration:none}
.stamp{position:absolute;top:26px;z-index:3;font-size:30px;font-weight:900;padding:2px 12px;border:4px solid;border-radius:10px;opacity:0;letter-spacing:2px}
.s-save{left:20px;color:var(--green);transform:rotate(-12deg)}.s-pass{right:20px;color:var(--pink);transform:rotate(12deg)}
nav{display:flex;justify-content:center;align-items:center;gap:26px;padding:10px 0 calc(16px + env(safe-area-inset-bottom))}
nav button{border:0;border-radius:50%;background:var(--card);color:var(--fg);box-shadow:0 4px 14px #0008;font-size:26px;cursor:pointer}
#no,#yes{width:68px;height:68px}#no{color:var(--pink)}#yes{color:var(--green)}
#undo{width:46px;height:46px;font-size:18px}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);line-height:1.7;padding:30px}
</style></head><body>
<header><b>💘 데이트 스와이프</b><span id="count"></span></header>
<div class="seg"><button data-v="deck" class="on">스와이프</button><button data-v="save">♥ 저장 <span id="ns"></span></button><button data-v="pass">✕ 패스 <span id="np"></span></button></div>
<div id="list"></div>
<div id="stack"></div>
<div id="map"></div>
<nav><button id="no" aria-label="패스">✕</button><button id="undo" aria-label="되돌리기">↶</button><button id="yes" aria-label="저장">♥</button></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script>
const LS=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
if(location.search.includes("reset")){try{localStorage.clear()}catch(e){}}
let seen=LS("seen")||[],queue=LS("queue")||[],dec=LS("dec")||{},snap=LS("snap")||{},cards=[],hist=[],sending=false,view="deck";
const stack=document.getElementById("stack"),cnt=document.getElementById("count");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let STATIONS={};
const EMOJI={"식당":"🍽","카페":"☕","술집":"🍷","팝업스토어":"🛍","전시·축제·기타":"🎨"};
const fmt=d=>d?d.slice(2).replace(/-/g,"."):"?";

function body(c){
  const dist=c.distance_m?`${esc(c.station)}역 ${c.distance_m}m`:`${esc(c.station)}역 인근`;
  const per=(c.period_start||c.period_end)?`<div class=row><i>📅</i><div>${fmt(c.period_start)} ~ ${fmt(c.period_end)}</div></div>`:"";
  const stats=c.reviews_total?`<div class=stats>
    <div class=stat><b>${Number(c.reviews_total).toLocaleString()}</b><span>후기</span></div>
    <div class=stat><b>${c.weekly_growth?"+"+c.weekly_growth:"-"}</b><span>주간 증가</span></div></div>`:"";
  const menu=c.menu?`<div class=row><i>🍴</i><div>대표 ${esc(c.menu)} ${esc(c.price||"")}${c.price_band?` · 가격대 ${esc(c.price_band)}`:""} <small>(후기 ${c.menu_mentions||1}건 언급 기준)</small></div></div>`:"";
  const vibe=c.vibe?`<div class=row><i>✨</i><div>${esc(c.vibe)}</div></div>`:"";
  const ph=photoList(c);
  const first=ph[0];
  const tabs=ph.length>1?`<div class=tabs>${ph.map((p,i)=>`<button data-i="${i}" class="${i?"":"on"}">${p.label}</button>`).join("")}</div>`:"";
  return `<div class=photo>${EMOJI[c.category]||"📍"}${first?imgTag(first.imgs[0],1,first.imgs.length):""}${tabs}${c.surge?'<span class=badge>🔥 급상승</span>':""}</div>
  <div class=info><h2>${esc(c.name)}</h2>
  <div class=chips><span class="chip cat">${esc(c.category)}</span>${c.kind?`<span class=chip>${esc(c.kind)}</span>`:""}<span class=chip>📍 ${dist}</span></div>
  ${stats}${per}${menu}${vibe}
  <a class=map href="${esc(c.map_url)}" target=_blank rel=noopener>카카오맵에서 보기</a></div>
  <div class="stamp s-save">저장</div><div class="stamp s-pass">패스</div>`;
}
const LABEL={food:"음식",mood:"분위기",outside:"외관"};
function photoList(c){
  const l=[];
  for(const k of ["food","mood","outside"]){const v=c["photo_"+k];if(v)l.push({label:LABEL[k],imgs:v.split("§").map(x=>{const[hi,lo]=x.split("|");return{hi,lo}}),i:0})}
  if(!l.length&&(c.thumb||c.thumb_lo))l.push({label:"사진",imgs:[{hi:c.thumb,lo:c.thumb_lo}],i:0});
  c._ph=l;return l;
}
const imgTag=(p,n,t)=>`<img src="${esc((p.hi||p.lo).replace(/^http:/,"https:"))}" data-lo="${esc((p.lo||"").replace(/^http:/,"https:"))}" referrerpolicy="no-referrer" alt="">${t>1?`<span class=cnt>${n}/${t}</span>`:""}`;
function showPhoto(el,g){const ph=el.querySelector(".photo");ph.querySelector("img")?.remove();ph.querySelector(".cnt")?.remove();
  ph.insertAdjacentHTML("afterbegin",imgTag(g.imgs[g.i],g.i+1,g.imgs.length));bind(el)}
function fixImgs(el,c){
  let cur=c._ph[0];
  el.querySelectorAll(".tabs button").forEach(b=>{
    b.onpointerdown=e=>e.stopPropagation();
    b.onclick=e=>{e.stopPropagation();cur=c._ph[b.dataset.i];
      el.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));showPhoto(el,cur)}});
  const ph=el.querySelector(".photo");
  ph.onclick=e=>{if(!cur||cur.imgs.length<2||e.target.closest("button"))return;cur.i=(cur.i+1)%cur.imgs.length;showPhoto(el,cur)}; // 사진 탭하면 다음 장
  bind(el);
}
function bind(el){
  const im=el.querySelector("img");if(!im)return;
  im.onerror=()=>{const lo=im.dataset.lo;if(lo&&im.src!==lo){im.src=lo}else im.remove()};
  im.onload=()=>{if(im.naturalWidth<40)im.onerror()};
}
function render(){
  stack.innerHTML="";
  const rest=deckCards();
  cnt.textContent=rest.length?`남은 ${rest.length}곳`:"";
  if(!rest.length){stack.innerHTML='<div class=empty>다 봤어요 🎉<br>다음 주 갱신을 기다려주세요.</div>';return}
  if(rest[1]){const b=document.createElement("div");b.className="card back";b.innerHTML=body(rest[1]);stack.appendChild(b);fixImgs(b,rest[1])}
  const el=document.createElement("div");el.className="card";el.innerHTML=body(rest[0]);stack.appendChild(el);fixImgs(el,rest[0]);
  drag(el,rest[0]);
}
function drag(el,c){
  let x0=null,y0=null,dx=0,moved=false;
  el.onpointerdown=e=>{if(e.target.closest("a,button"))return;x0=e.clientX;y0=e.clientY;moved=false;el.setPointerCapture(e.pointerId);el.style.transition="none"};
  el.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>6)moved=true;
    el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    el.querySelector(".s-save").style.opacity=Math.min(1,Math.max(0,dx/90));
    el.querySelector(".s-pass").style.opacity=Math.min(1,Math.max(0,-dx/90))};
  el.onpointerup=()=>{if(x0===null)return;x0=null;el.style.transition="transform .25s";
    if(Math.abs(dx)>90)fly(el,c,dx>0?"save":"pass");
    else{el.style.transform="";el.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0)}dx=0};
}
function fly(el,c,action){
  el.style.transition="transform .28s,opacity .28s";
  el.style.transform=`translateX(${action==="save"?600:-600}px) rotate(${action==="save"?25:-25}deg)`;el.style.opacity=0;
  setTimeout(()=>decide(c,action),220);
}
function decide(c,action){
  seen.push(c.place_id);SV("seen",seen);
  dec[c.place_id]={action,ts:new Date().toISOString()};SV("dec",dec);
  const {_ph,...plain}=c;snap[c.place_id]=plain;SV("snap",snap);
  queue.push({place_id:c.place_id,action,ts:new Date().toISOString()});SV("queue",queue);
  flush();render();
}
async function flush(){
  if(sending||!window.SWIPE_ENDPOINT||!queue.length)return;
  sending=true;const batch=queue.slice();
  try{await fetch(window.SWIPE_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(batch)});
    queue=queue.slice(batch.length);SV("queue",queue)}catch(e){}
  sending=false;if(queue.length)flush();
}
const cur=()=>deckCards()[0];
const act=a=>{const c=cur(),el=stack.querySelector(".card:not(.back)");if(c&&el)fly(el,c,a)};
document.getElementById("yes").onclick=()=>act("save");
document.getElementById("no").onclick=()=>act("pass");
document.getElementById("undo").onclick=()=>{ // 마지막 선택 되돌리기(아직 전송 전이면 대기열에서도 제거, 이미 전송됐으면 화면에서만 복구)
  if(!seen.length)return;const id=seen.pop();SV("seen",seen);delete dec[id];SV("dec",dec);
  const i=queue.map(q=>q.place_id).lastIndexOf(id);if(i>=0){queue.splice(i,1);SV("queue",queue)}render()};
addEventListener("keydown",e=>{if(e.key==="ArrowRight")act("save");if(e.key==="ArrowLeft")act("pass")});
const histIds=()=>new Set(hist.map(h=>h.place_id));
function deckCards(){const hs=histIds();return cards.filter(c=>!seen.includes(c.place_id)&&!hs.has(c.place_id))}
function records(){ // 기록 합치기: 서버 history + 이 폰의 최신 결정(우선)
  const m={};
  hist.forEach(h=>m[h.place_id]={...h,action:h.action});
  Object.entries(dec).forEach(([id,d])=>{const base=m[id]||snap[id]||cards.find(c=>c.place_id===id);if(base)m[id]={...base,action:d.action}});
  return Object.values(m);
}
function counts(){const r=records();document.getElementById("ns").textContent=r.filter(x=>x.action==="save").length||"";document.getElementById("np").textContent=r.filter(x=>x.action==="pass").length||""}
function showList(kind){
  const L=document.getElementById("list"),r=records().filter(x=>x.action===kind);
  L.innerHTML=r.length?r.map(c=>{const p=(c.photo_food||c.photo_outside||c.photo_mood||c.thumb||c.thumb_lo||"").split("§")[0].split("|")[0];
    const sub=[c.category,c.distance_m?`${c.station}역 ${c.distance_m}m`:`${c.station}역 인근`].filter(Boolean).map(esc).join(" · ");
    const extra=[c.reviews_total?`후기 ${Number(c.reviews_total).toLocaleString()}`:"",c.menu?`${c.menu} ${c.price||""}${c.price_band?` (가격대 ${c.price_band})`:""}`:"",c.vibe||"",(c.period_end?`~${fmt(c.period_end)}`:"")].filter(Boolean).map(esc).join(" · ");
    const rv=c.score?`<div>⭐ ${esc(c.score)} ${esc(c.review||"")}</div>`:"";
    return `<div class=item><div class=th>${EMOJI[c.category]||"📍"}${p?`<img src="${esc(p.replace(/^http:/,"https:"))}" referrerpolicy="no-referrer" onerror="this.remove()" alt="">`:""}</div>
    <div class=tx><b>${esc(c.name)}</b><small>${sub}</small><div>${extra}</div>${rv}
    <div class=bt><a href="${esc(c.map_url)}" target=_blank rel=noopener>카카오맵</a><button data-id="${esc(c.place_id)}" data-to="${kind==="save"?"pass":"save"}">${kind==="save"?"✕ 패스로 이동":"♥ 저장으로 이동"}</button></div></div></div>`}).join(""):'<div class=empty style="position:static;padding:60px 0">아직 없어요</div>';
  L.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id,to=b.dataset.to;dec[id]={action:to,ts:new Date().toISOString()};SV("dec",dec);
    queue.push({place_id:id,action:to,ts:dec[id].ts});SV("queue",queue);flush();counts();showList(kind)});
}
function setView(v){
  view=v;document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  const deck=v==="deck";document.getElementById("stack").style.display=deck?"":"none";
  document.querySelector("nav").style.display=deck?"":"none";document.getElementById("map").style.display=deck?"":"none";document.getElementById("list").style.display=deck?"none":"block";
  if(deck)render();else showList(v);
}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setView(b.dataset.v));
let map=null,layer=null;
function showMap(c){
  const box=document.getElementById("map");
  if(!window.L||!c||!c.lat){box.style.display="none";return}
  box.style.display="";
  if(!map){map=L.map("map",{zoomControl:false,attributionControl:true}).setView([c.lat,c.lng],16);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19,attribution:"© OSM © CARTO"}).addTo(map);
    layer=L.layerGroup().addTo(map)}
  map.invalidateSize();layer.clearLayers();
  const p=[+c.lat,+c.lng];
  L.marker(p,{icon:L.divIcon({className:"pin",iconSize:[18,18]})}).addTo(layer);
  const st=STATIONS[c.station];let pts=[p];
  if(st){L.marker([st.lat,st.lng],{icon:L.divIcon({className:"stn",html:"🚇 "+esc(c.station)+"역",iconSize:null})}).addTo(layer);pts.push([st.lat,st.lng])}
  map.fitBounds(pts.length>1?pts:[p,p],{padding:[28,28],maxZoom:17});
}
const _render=render;render=function(){_render();counts();showMap(deckCards()[0])};
const jf=(u,d)=>fetch(u).then(r=>r.ok?r.json():d).catch(()=>d);
Promise.all([jf("cards.json",[]),jf("history.json",[]),jf("stations.json",{})]).then(([j,h,st])=>{cards=j;hist=h;STATIONS=st;setView("deck");flush()});
</script></body></html>
